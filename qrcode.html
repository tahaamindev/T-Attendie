<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#00c853" />
  <meta name="description" content="T Attendii QR Attendance Card Generator" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>T Attendii</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
  <link rel="stylesheet" href="./styles2.css" />
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="navbar-inner">
      <div class="navbar-brand">
        <div class="brand-icon">
          <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
            <rect x="4" y="4" width="10" height="10" rx="2" fill="#00E65A"/>
            <rect x="18" y="4" width="10" height="10" rx="2" fill="#00E65A"/>
            <rect x="4" y="18" width="10" height="10" rx="2" fill="#00E65A"/>
            <circle cx="23" cy="23" r="4" fill="#00E65A"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">T Attendii</span>
          <span class="brand-sub">QR Card Generator</span>
        </div>
      </div>
      <div class="navbar-actions">
        <div class="navbar-dept"><span id="navbarDeptLabel">All Depts</span></div>
        <button class="add-btn" id="addBtn" aria-label="Add student">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M8 3V13M3 8H13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Add
        </button>
      </div>
    </div>
  </header>

  <!-- ADD STUDENT MODAL -->
  <div class="modal-overlay" id="modalOverlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">New Student</span>
        <button class="modal-close" id="modalClose" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M4 4L14 14M14 4L4 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="field-group">
          <label class="field-label">Student Name</label>
          <input class="field-input" id="inputName" type="text" placeholder="e.g. Muhammad Ahmed" autocomplete="off" />
        </div>
        <div class="field-group">
          <label class="field-label">Student ID</label>
          <input class="field-input" id="inputId" type="text" placeholder="e.g. ANE-2025-001" autocomplete="off" />
        </div>
        <div class="field-group">
          <label class="field-label">Department</label>
          <input class="field-input" id="inputDept" type="text" placeholder="e.g. Anesthesia" autocomplete="off" />
        </div>
        <p class="field-error" id="fieldError"></p>
        <button class="modal-submit" id="modalSubmit">Generate Student</button>
      </div>
    </div>
  </div>

  <!-- MAIN VIEWS -->
  <main class="app-main">

    <!-- STUDENT LIST VIEW -->
    <div class="view" id="viewList">
      <div class="list-header">
        <div class="list-title">Students</div>
        <div class="list-count" id="listCount">0 students</div>
      </div>

      <div class="filter-bar">
        <input class="search-input" id="searchInput" type="search" placeholder="Search by name or ID…" autocomplete="off" />
        <select class="dept-select" id="deptFilter">
          <option value="">All Departments</option>
        </select>
      </div>

      <div class="empty-state" id="emptyState" style="display:none;">
        <div class="empty-icon">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <rect x="8" y="8" width="14" height="14" rx="3" fill="#00E65A" opacity="0.3"/>
            <rect x="26" y="8" width="14" height="14" rx="3" fill="#00E65A" opacity="0.3"/>
            <rect x="8" y="26" width="14" height="14" rx="3" fill="#00E65A" opacity="0.3"/>
            <circle cx="33" cy="33" r="6" fill="#00E65A" opacity="0.3"/>
          </svg>
        </div>
        <p class="empty-title" id="emptyTitle">No students yet</p>
        <p class="empty-sub" id="emptySub">Tap <strong>Add</strong> to create your first student card.</p>
      </div>

      <div class="student-grid" id="studentGrid"></div>
    </div>

    <!-- QR CARD VIEW -->
    <div class="view" id="viewCard" style="display:none;">
      <div class="card-view-header">
        <button class="back-btn" id="backBtn">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M12.5 15L7.5 10L12.5 5" stroke="#00E65A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Students
        </button>
        <button class="download-btn" id="downloadBtn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M8 2V10M8 10L5 7M8 10L11 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Download PNG
        </button>
      </div>

      <div class="card-stage">
        <div class="qr-card" id="qrCard">
          <div class="card-header">
            <div class="card-brand">T Attendii</div>
            <div class="card-dept-badge" id="cardDeptBadge">DEPARTMENT</div>
          </div>
          <div class="card-divider"></div>
          <div class="card-qr-wrap">
            <div class="card-qr-inner">
              <canvas id="qrCanvas"></canvas>
            </div>
          </div>
          <div class="card-student-info">
            <div class="card-student-name" id="cardStudentName">Student Name</div>
            <div class="card-student-id" id="cardStudentId">ID: ———</div>
          </div>
          <div class="card-divider card-divider--bottom"></div>
          <div class="card-footer">T Attendii by TAHA AMIN</div>
        </div>
      </div>
    </div>

  </main>

  <script src="./script2.js"></script>
</body>
</html>
